name: Release

# Publishes to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) -- no API token/secret required.
# One-time setup on PyPI: add a "pending publisher" for project
# `pecan-apispec` pointing at this repository, workflow `release.yml`,
# and environment `pypi`.  Also create a GitHub Environment named `pypi`.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.17"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pecan-apispec/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish to PyPI
        run: uv publish
